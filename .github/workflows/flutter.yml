name: Flutter Build APK

on:
  push:
    branches: [main]
    paths:
      - 'agn-app/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create fresh Flutter project
        run: |
          mkdir -p /tmp/agn-build
          cd /tmp/agn-build
          flutter create --org com.zaxver --project-name agn_app --platforms android .

      - name: Copy source files
        run: |
          rm -rf /tmp/agn-build/lib/*
          cp -r $GITHUB_WORKSPACE/agn-app/lib/* /tmp/agn-build/lib/
          cp $GITHUB_WORKSPACE/agn-app/pubspec.yaml /tmp/agn-build/pubspec.yaml
          # Inject INTERNET permission + usesCleartextTraffic + networkSecurityConfig into manifest
          python3 << 'PYEOF'
          import os
          # Create network security config XML (no leading whitespace)
          xml_dir = '/tmp/agn-build/android/app/src/main/res/xml'
          os.makedirs(xml_dir, exist_ok=True)
          nsc = '<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n  <base-config cleartextTrafficPermitted="true">\n    <trust-anchors>\n      <certificates src="system" />\n      <certificates src="user" />\n    </trust-anchors>\n  </base-config>\n</network-security-config>\n'
          with open(os.path.join(xml_dir, 'network_security_config.xml'), 'w') as f:
              f.write(nsc)
          # Modify AndroidManifest.xml
          p = '/tmp/agn-build/android/app/src/main/AndroidManifest.xml'
          with open(p) as f: c = f.read()
          # Add INTERNET permission before <application>
          if 'android.permission.INTERNET' not in c:
              c = c.replace('<application', '    <uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          # Add usesCleartextTraffic + networkSecurityConfig to <application>
          if 'usesCleartextTraffic' not in c:
              c = c.replace('<application', '<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config"', 1)
          # Rename app label
          c = c.replace('android:label="agn_app"', 'android:label="AGN Studios"')
          with open(p, 'w') as f: f.write(c)
          print('Manifest updated:')
          print(c[:500])
          PYEOF

      - name: Install dependencies
        run: cd /tmp/agn-build && flutter pub get

      - name: Build APK
        run: cd /tmp/agn-build && flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agn-android-apk
          path: /tmp/agn-build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90