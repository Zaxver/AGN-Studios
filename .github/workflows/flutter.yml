name: Flutter Build APK

on:
  push:
    branches: [main]
    paths:
      - 'agn-app/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create fresh Flutter project
        run: |
          mkdir -p /tmp/agn-build
          cd /tmp/agn-build
          flutter create --org com.zaxver --project-name agn_app --platforms android .

      - name: Copy source files
        run: |
          rm -rf /tmp/agn-build/lib/*
          cp -r $GITHUB_WORKSPACE/agn-app/lib/* /tmp/agn-build/lib/
          cp $GITHUB_WORKSPACE/agn-app/pubspec.yaml /tmp/agn-build/pubspec.yaml

      - name: Configure Android manifest
        run: |
          mkdir -p /tmp/agn-build/android/app/src/main/res/xml
          python3 << 'SCRIPT'
          import os
          xml_dir = '/tmp/agn-build/android/app/src/main/res/xml'
          os.makedirs(xml_dir, exist_ok=True)
          nsc = '<?xml version="1.0" encoding="utf-8"?>\n'
          nsc += '<network-security-config>\n'
          nsc += '    <base-config cleartextTrafficPermitted="true">\n'
          nsc += '        <trust-anchors>\n'
          nsc += '            <certificates src="system" />\n'
          nsc += '            <certificates src="user" />\n'
          nsc += '        </trust-anchors>\n'
          nsc += '    </base-config>\n'
          nsc += '</network-security-config>\n'
          with open(os.path.join(xml_dir, 'network_security_config.xml'), 'w') as f:
              f.write(nsc)
          manifest = '<?xml version="1.0" encoding="utf-8"?>\n'
          manifest += '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
          manifest += '    <uses-permission android:name="android.permission.INTERNET" />\n'
          manifest += '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
          manifest += '    <application\n'
          manifest += '        android:label="AGN Studios"\n'
          manifest += '        android:name="${applicationName}"\n'
          manifest += '        android:icon="@mipmap/ic_launcher"\n'
          manifest += '        android:usesCleartextTraffic="true"\n'
          manifest += '        android:networkSecurityConfig="@xml/network_security_config">\n'
          manifest += '        <activity\n'
          manifest += '            android:name=".MainActivity"\n'
          manifest += '            android:exported="true"\n'
          manifest += '            android:launchMode="singleTop"\n'
          manifest += '            android:taskAffinity=""\n'
          manifest += '            android:theme="@style/LaunchTheme"\n'
          manifest += '            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"\n'
          manifest += '            android:hardwareAccelerated="true"\n'
          manifest += '            android:windowSoftInputMode="adjustResize">\n'
          manifest += '            <meta-data\n'
          manifest += '                android:name="io.flutter.embedding.android.NormalTheme"\n'
          manifest += '                android:resource="@style/NormalTheme" />\n'
          manifest += '            <intent-filter>\n'
          manifest += '                <action android:name="android.intent.action.MAIN" />\n'
          manifest += '                <category android:name="android.intent.category.LAUNCHER" />\n'
          manifest += '            </intent-filter>\n'
          manifest += '        </activity>\n'
          manifest += '        <meta-data\n'
          manifest += '            android:name="flutterEmbedding"\n'
          manifest += '            android:value="2" />\n'
          manifest += '    </application>\n'
          manifest += '</manifest>\n'
          p = '/tmp/agn-build/android/app/src/main/AndroidManifest.xml'
          with open(p, 'w') as f:
              f.write(manifest)
          print('Manifest written successfully')
          with open(p) as f:
              print(f.read()[:300])
          SCRIPT

      - name: Install dependencies
        run: cd /tmp/agn-build && flutter pub get

      - name: Build APK
        run: cd /tmp/agn-build && flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agn-android-apk
          path: /tmp/agn-build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90